[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demandflow-ai"
version = "2.0.0"
description = "Enterprise Time-Series Demand Forecasting & Inventory Optimization Engine using TensorFlow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DemandFlow Engineering Team" }
]
keywords = [
    "deep-learning",
    "time-series-forecasting",
    "tensorflow",
    "keras",
    "lstm",
    "attention-mechanism",
    "retail-analytics",
    "inventory-optimization",
    "erp-plugin",
    "fastapi"
]
dependencies = [
    "tensorflow>=2.16.0",
    "keras>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*"]
